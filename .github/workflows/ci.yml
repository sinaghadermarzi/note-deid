name: ci

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm,data]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest -q
      - name: Offline quick start (demo synphi build -> simulated run -> summary tables)
        run: |
          python -m note_deid.data.synphi build --profile configs/synphi/i2b2like.yaml \
            --out data/synphi/demo --demo --repeat 4 --seed 0
          python -m note_deid.run --config configs/experiments/smoke_simulated.yaml --out ci-results
          run_dir=$(ls -d ci-results/smoke_simulated/*)
          python -m note_deid.summarize "$run_dir" --out ci-results/summary/smoke_simulated
          test -s ci-results/summary/smoke_simulated.csv
          test -s ci-results/summary/smoke_simulated.complementarity.csv
