[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "note-deid"
version = "0.0.1"
description = "Hybrid LLM + token-classifier de-identification of clinical notes: research framework"
readme = "README.md"
authors = [{name = "Sina Ghadermarzi"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/sinaghadermarzi/note-deid"

[project.optional-dependencies]
# LLM backend (commercial APIs and OpenAI-compatible local servers through LiteLLM)
llm = [
  "litellm>=1.50",
  "tenacity>=8.2",
  "diskcache>=5.6",
  "rapidfuzz>=3.9",
]
# Token-classification backend (HF Transformers; OPF CLI is installed separately, see scripts/)
finetune = [
  "torch>=2.3",
  "transformers>=4.45",
  "accelerate>=1.0",
  "datasets>=2.20",
  "seqeval>=1.2.2",
  "sentencepiece>=0.2",
  "protobuf>=4",
]
# Benchmark construction (synphi) and open-corpus loaders
data = [
  "faker>=30.0",
  "datasets>=2.20",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
