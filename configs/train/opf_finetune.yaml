# Placeholder hyperparameters for fine-tuning the OpenAI Privacy Filter (phase P1/P3). Values to be tuned.
# HF path (`python -m note_deid.tc.train`): reads the unified JSONL written by `synphi build`; the checkpoint emits
# the labels of `label_space`, so the runner needs no label_map for i2b2_28 / i2b2_categories / binary.
base_model: openai/privacy-filter
label_space: i2b2_28         # 28-label BIOES head (H13 option a). Alternatives: i2b2_categories | binary | opf8
                             # (native OPF labels through this path; that checkpoint then needs label_map: opf_category
                             # and is comparable at category level only)
train_jsonl: data/synphi/v0.1/train.jsonl
dev_jsonl: data/synphi/v0.1/dev.jsonl
output_dir: models/opf-synphi-v0.1
learning_rate: 2.0e-5
epochs: 3
per_device_batch_size: 4
gradient_accumulation: 4
max_length: 8192             # OPF supports 128k; cap for memory
precision: bf16              # a100: bf16; mac/cpu: fp32
seeds: [13, 42, 2024]
# HF path (this file):   python -m note_deid.tc.train --config configs/train/opf_finetune.yaml
# Native-OPF CLI path:   python -m note_deid.data.synphi export-opf --bench data/synphi/v0.1
#                        opf train data/synphi/v0.1/train.opf.jsonl --output-dir models/opf-native-synphi-v0.1 [--device cpu|gpu]
